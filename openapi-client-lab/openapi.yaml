openapi: 3.0.3

info:
  title: Users API
  version: 1.0.0
  description: Учебный API для получения пользователей

servers:
  - url: https://jsonplaceholder.typicode.com

paths:
  /users:
    get:
      operationId: getUsers
      summary: Получить список пользователей
      responses:
        '200':
          description: Список пользователей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

components:
  schemas:
    User:
      type: object
      required:
        - id
        - name
        - email
      properties:
        id:
          type: integer
        name:
          type: string
        username:
          type: string
        email:
          type: string
